[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyrex-mcp"
version = "0.1.0"
description = "MCP server to run TinyRex Apify Store actors with your APIFY_TOKEN"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TinyRex" }]
keywords = ["mcp", "apify", "scrapers", "tinyrex", "model-context-protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "mcp>=1.12,<2",
  "apify-client>=1.8,<3",
]

[project.urls]
Homepage = "https://github.com/emirmrkaljevic/tinyrex-mcp"
Store = "https://apify.com/tinyrex"
Issues = "https://github.com/emirmrkaljevic/tinyrex-mcp/issues"

[project.scripts]
tinyrex-mcp = "tinyrex_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinyrex_mcp = ["actors.json"]
